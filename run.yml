name: audio-to-text-bot

on:
  schedule:
    # 글이 보통 8:30 / 9:30 / 11:30 / 14:30 (KST, ±30분 오차)에 올라온다고 해서
    # "아침 블록(8:00~12:30 KST)"과 "오후 블록(14:00~15:30 KST)"만 30분마다 체크합니다.
    # (그 사이 12:30~14:00은 글이 안 올라오는 시간이라 체크를 쉽니다 → 실행 횟수 절약)
    #
    # ⚠️ GitHub Actions cron은 UTC 기준입니다. KST = UTC+9라서
    # "한국 아침 8:00~8:30"은 UTC로는 "전날 23:00~23:30"이 되어 날짜가 하루 당겨집니다.
    # 그래서 이 블록만 요일 조건을 하루씩 당겨서 (월~금 → 일~목) 적용했습니다.

    # 블록 1: KST 08:00, 08:30 (= UTC 전날 23:00, 23:30) — 요일은 UTC 기준 일~목(한국 기준 월~금)
    - cron: "0,30 23 * * 0-4"

    # 블록 2: KST 09:00~12:30 그리고 14:00~15:30 (= UTC 0-3시, 5-6시) — 요일 월~금 그대로
    - cron: "0,30 0-3,5,6 * * 1-5"

  workflow_dispatch: {}  # 수동으로도 실행 가능 (Actions 탭에서 Run workflow 버튼)

permissions:
  contents: write  # last_seen.json을 저장소에 다시 커밋하기 위해 필요

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_PW: ${{ secrets.SITE_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit last_seen.json if changed
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          if ! git diff --quiet -- last_seen.json; then
            git add last_seen.json
            git commit -m "update last_seen.json [skip ci]"
            git push
          else
            echo "변경 없음, 커밋 생략"
          fi
